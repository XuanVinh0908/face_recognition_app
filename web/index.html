<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chấm Công AI</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js" crossorigin="anonymous"></script>
  
  <script>
    var areModelsLoaded = false;
    var videoStream = null;
    var detectionLoopId = null;
    const TARGET_ID_PART = "video-view";

    // CẤU HÌNH NHẬN DIỆN (Real-time)
    // Input 416, Score 0.5 là chuẩn
    function getOptions() {
        return new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.5 });
    }

    async function loadModels() {
        if (areModelsLoaded) return true;
        let path = window.location.pathname;
        let folderPath = path.substring(0, path.lastIndexOf('/') + 1);
        let origin = window.location.origin;
        if (origin.endsWith('/')) origin = origin.slice(0, -1);
        const MODEL_URL = origin + folderPath + 'weights';

        try {
            await Promise.all([
                faceapi.loadTinyFaceDetectorModel(MODEL_URL),
                faceapi.loadFaceLandmarkModel(MODEL_URL),
                faceapi.loadFaceRecognitionModel(MODEL_URL)
            ]);
            areModelsLoaded = true;
            console.log("JS: Models Loaded.");
            return true;
        } catch (e) {
            console.error("JS: Load Error:", e);
            return false;
        }
    }

    function findVideoElementDeep(root) {
        if (!root) return null;
        if (root.querySelectorAll) {
            const videos = root.querySelectorAll('video');
            for(let v of videos) {
                if (v.id && v.id.includes(TARGET_ID_PART)) return v;
            }
        }
        if (root.querySelectorAll) {
            const children = root.querySelectorAll('*');
            for (let child of children) {
                if (child.shadowRoot) {
                    const found = findVideoElementDeep(child.shadowRoot);
                    if (found) return found;
                }
            }
        }
        return null;
    }

    async function startCamera(unusedId, onVectorDetected, onBlinkDetected) {
        stopRealtimeDetection();

        let video = null;
        for(let i=0; i<20; i++) {
            video = findVideoElementDeep(document);
            if(video) break;
            await new Promise(r => setTimeout(r, 200));
        }

        if (!video) return false;

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } 
            });
            
            video.srcObject = stream;
            videoStream = stream;
            video.setAttribute("playsinline", "true");
            await video.play();
            
            // BẮT ĐẦU QUÉT REAL-TIME
            startRealtimeLoop(video, onVectorDetected);
            return true;
        } catch (err) {
            console.error("JS: Camera Error:", err);
            return false;
        }
    }

    function startRealtimeLoop(video, callback) {
        const options = getOptions();

        async function loop() {
            if (!videoStream || video.paused || video.ended) return;

            try {
                // QUÉT VÀ LẤY LUÔN DESCRIPTOR (VECTOR)
                // Đây là bước khác biệt: Lấy vector trực tiếp từ video
                const result = await faceapi.detectSingleFace(video, options)
                                            .withFaceLandmarks()
                                            .withFaceDescriptor();

                if (result) {
                    // Gửi Vector về Dart (Array float32)
                    callback(result.descriptor);
                } else {
                    // Gửi null báo không có mặt
                    callback(null);
                }
            } catch(e) {}

            // Lặp lại mỗi 100ms
            detectionLoopId = setTimeout(loop, 100);
        }
        loop();
    }

    // Hàm lấy vector từ ảnh (giữ lại cho trang đăng ký)
    async function getFaceDescriptor(canvasOrBase64, callback) {
        if (!areModelsLoaded) { callback.onDescriptorResult(null); return; }
        try {
            let img;
            if (typeof canvasOrBase64 === 'string') {
                img = new Image();
                img.src = canvasOrBase64;
                await img.decode();
            } else { img = canvasOrBase64; }

            const result = await faceapi.detectSingleFace(img, getOptions())
                                         .withFaceLandmarks()
                                         .withFaceDescriptor();
            if (result) callback.onDescriptorResult(result.descriptor);
            else callback.onDescriptorResult(null);
        } catch (error) { callback.onDescriptorResult(null); }
    }

    function stopRealtimeDetection() {
        if (detectionLoopId) clearTimeout(detectionLoopId);
        if (videoStream) {
            videoStream.getTracks().forEach(track => track.stop());
            videoStream = null;
        }
    }

    function closeWindow() {
        try { window.open('','_self').close(); } catch(e) {}
    }

    window.loadModels = loadModels;
    window.startCamera = startCamera;
    window.getFaceDescriptor = getFaceDescriptor;
    window.stopRealtimeDetection = stopRealtimeDetection;
    window.closeWindow = closeWindow;
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
