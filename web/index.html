<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>face_recognition_app</title>
  <link rel="manifest" href="manifest.json">
  
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js" crossorigin="anonymous"></script>
  
  <script>
    var areModelsLoaded = false;
    var videoStream = null;
    var detectionInterval = null;
    // Chuỗi chung trong ID của cả 2 trang để tìm kiếm
    const TARGET_ID_PART = "video-view";

    // --- HÀM TÌM KIẾM ĐỆ QUY (RECURSIVE SEARCH) ---
    function findVideoElementDeep(root) {
        if (!root) return null;

        // 1. Tìm thẻ video trực tiếp trong root hiện tại
        if (root.querySelectorAll) {
            const videos = root.querySelectorAll('video');
            for(let v of videos) {
                // Nếu ID chứa chuỗi chung là lấy luôn
                if (v.id && v.id.includes(TARGET_ID_PART)) return v;
            }
        }

        // 2. Nếu không thấy, đào sâu vào các phần tử con có Shadow Root
        if (root.querySelectorAll) {
            const children = root.querySelectorAll('*');
            for (let child of children) {
                if (child.shadowRoot) {
                    const found = findVideoElementDeep(child.shadowRoot);
                    if (found) return found;
                }
            }
        }
        return null;
    }

    async function loadModels() {
        if (areModelsLoaded) return true;
        const modelPath = '/weights';
        console.log("JS: Bắt đầu tải model...");
        try {
            await Promise.all([
                faceapi.loadTinyFaceDetectorModel(modelPath),
                faceapi.loadFaceLandmarkModel(modelPath),
                faceapi.loadFaceRecognitionModel(modelPath)
            ]);
            areModelsLoaded = true;
            console.log("JS: Model đã tải xong.");
            return true;
        } catch (error) {
            console.error("JS: Lỗi tải model:", error);
            return false;
        }
    }

    async function startCamera(unusedId, onFaceDetected, onBlinkDetected) {
        console.log("JS: Đang quét sâu vào DOM để tìm video...");
        
        // Thử tìm tối đa 15 lần (3 giây)
        let video = null;
        for(let i=0; i<15; i++) {
            video = findVideoElementDeep(document);
            if(video) {
                 console.log("JS: Đã tìm thấy thẻ video thành công:", video);
                 break;
            }
            await new Promise(r => setTimeout(r, 200));
        }

        if (!video) {
            console.error("JS: TUYỆT ĐỐI KHÔNG TÌM THẤY THẺ VIDEO!");
            alert("Lỗi nghiêm trọng: Không tìm thấy khung Video trong Shadow DOM. Hãy tải lại trang (F5).");
            return false;
        }

        try {
            console.log("JS: Đang xin quyền getUserMedia...");
            const stream = await navigator.mediaDevices.getUserMedia({ video: {} });
            console.log("JS: Đã cấp quyền.");
            
            video.srcObject = stream;
            videoStream = stream;

            // Đợi video load metadata để lấy kích thước chuẩn
            await new Promise(resolve => video.onloadedmetadata = resolve);
            video.play();
            
            // Gán kích thước thực cho video để face-api xử lý đúng
            video.width = video.videoWidth;
            video.height = video.videoHeight;
            console.log(`JS: Video bắt đầu phát với kích thước ${video.width}x${video.height}`);

            video.onplay = () => {
                if (detectionInterval) clearInterval(detectionInterval);
                detectionInterval = setInterval(async () => {
                    if (!areModelsLoaded) return;
                    try {
                        // Sử dụng TinyFaceDetector cho nhanh nhẹ
                        const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions());
                        if (detection) {
                            // Gửi về hộp bao quanh khuôn mặt (bounding box)
                            onFaceDetected(detection.box);
                        }
                    } catch(e) {}
                }, 200); // Quét mỗi 200ms
            };
            
            return true;
        } catch (err) {
            console.error("JS: Lỗi Camera:", err);
            alert("Lỗi Camera: " + err.message);
            return false;
        }
    }

    async function getFaceDescriptor(canvasOrBase64, callback) {
        if (!areModelsLoaded) {
            callback.onDescriptorResult(null);
            return;
        }
        try {
            let img;
            // Xử lý đầu vào có thể là Canvas hoặc chuỗi Base64
            if (typeof canvasOrBase64 === 'string') {
                img = new Image();
                img.src = canvasOrBase64;
                await img.decode();
            } else {
                img = canvasOrBase64; // Là thẻ Canvas
            }

            const detection = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions())
                                         .withFaceLandmarks()
                                         .withFaceDescriptor();

            if (detection) {
                callback.onDescriptorResult(detection.descriptor);
            } else {
                callback.onDescriptorResult(null);
            }
        } catch (error) {
            console.error("JS Error descriptor:", error);
            callback.onDescriptorResult(null);
        }
    }

    function stopRealtimeDetection() {
        if (detectionInterval) clearInterval(detectionInterval);
        if (videoStream) {
            videoStream.getTracks().forEach(track => track.stop());
            videoStream = null;
        }
        console.log("JS: Đã dừng Camera và detection.");
    }

    function closeWindow() {
        try { window.close(); } catch(e) {}
    }

    window.loadModels = loadModels;
    window.startCamera = startCamera;
    window.getFaceDescriptor = getFaceDescriptor;
    window.stopRealtimeDetection = stopRealtimeDetection;
    window.closeWindow = closeWindow;
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
